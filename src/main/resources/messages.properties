# Messages the REST layer resolves against the caller's locale.
#
# Keys under "error." are derived from the domain exception types that report them, as
# error.<module>.<type name in kebab case, without the Exception suffix>. MessageBundleTest checks
# that every concrete DomainException subclass has an entry here, and that every locale bundle
# carries the same keys as this one. Renaming an exception class renames its key, and the build
# fails until this file follows.

error.shared.unauthenticated=Authentication is required to perform this action.
error.shared.invalid-page=A page is counted from 0 and holds from 1 to {2} items, got page {0} of size {1}.
error.shared.unsortable-column=This list cannot be sorted by {0}, only by {1}.
error.shared.invalid-sort-direction=A sort direction is asc or desc, got {0}.

# Keys under "error.shared" that no exception type derives. Both are constants, the first on
# InfrastructureException and the second on InfrastructureExceptionHandler, because a technical
# failure reports one wording whatever raised it.
error.shared.infrastructure=The service is temporarily unavailable. Please try again later.
error.shared.unexpected=The request could not be completed.

error.directory.missing-person-id=A person must have an id.
error.directory.missing-username=A person must have a username.
error.directory.missing-display-name=A person must have a display name.
error.directory.missing-job-title=A person must have a job title.
error.directory.missing-department=A person must have a department.
error.directory.blank-username=A username cannot be blank.
error.directory.blank-display-name=A display name cannot be blank.
error.directory.blank-job-title=A job title cannot be blank.
error.directory.blank-department=A department cannot be blank.
error.directory.blank-password-hash=A password hash cannot be blank.
error.directory.person-not-found=No person found for {0}.
error.directory.too-many-people-requested=At most {0} people can be looked up at once, got {1}.

error.identityprovider.missing-api-resource-id=An API resource must have an id.
error.identityprovider.missing-client-registration-id=A client registration must have an id.
error.identityprovider.missing-resource-identifier=An API resource must have an identifier.
error.identityprovider.missing-client-id=A client registration must have a client id.
error.identityprovider.missing-client-kind=A client registration must say whether it is public or confidential.
error.identityprovider.confidential-client-without-secret=A confidential client must have a secret.
error.identityprovider.public-client-with-secret=A public client cannot have a secret.
error.identityprovider.invalid-resource-identifier=A resource identifier is one word, got "{0}".
error.identityprovider.invalid-app-role=An application role is one word, got "{0}".
error.identityprovider.invalid-service-scope=A service scope is one word, got "{0}".
error.identityprovider.invalid-client-id=A client id is one word, got "{0}".
error.identityprovider.invalid-redirect-uri=A redirect URI is one word, got "{0}".
error.identityprovider.invalid-client-secret-hash=A client secret hash is one word, got "{0}".

